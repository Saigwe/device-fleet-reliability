# Synthetic fixture for CI. Same table and column names as the real-data load.
# pk / fk / cast describe the tables for staging and tests; the generator ignores them.
seed: 505
tables:
  - name: sites
    rows: 20
    pk: site_id
    columns:
      site_id: {type: id, prefix: S, width: 3}
      region: {type: choice, values: [UK North, UK South, Ireland, US East]}
  - name: devices
    rows: 800
    pk: device_id
    fk: {site_id: sites.site_id}
    cast: {install_date: date}
    columns:
      device_id: {type: id, prefix: D}
      site_id: {type: fk, table: sites, column: site_id}
      model: {type: choice, values: [DX-100, DX-200, DX-300], p: [0.4, 0.4, 0.2]}
      install_date: {type: date, start: 2021-01-01, end: 2024-12-31}
  - name: device_days
    grid: {parent: devices.device_id, start: 2025-01-01, end: 2025-03-31, freq: D, column: status_date}
    pk: [device_id, status_date]
    fk: {device_id: devices.device_id}
    cast: {status_date: date}
    columns:
      failed: {type: expr, expr: "rng.random(n) < df.device_id.map(tables['devices'].set_index('device_id').model).map({'DX-100': 0.0008, 'DX-200': 0.0003, 'DX-300': 0.0002}).to_numpy()"}
