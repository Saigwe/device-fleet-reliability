name: device_fleet_reliability
version: 0.2.0
config-version: 2
profile: device_fleet_reliability

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  # Backblaze's own quarterly reports only publish AFR for models with at least this much exposure.
  min_drives_for_reporting: 100
  min_drive_days_for_reporting: 10000

models:
  device_fleet_reliability:
    +meta:
      owner: reliability-analytics
    staging:
      +schema: silver
      +materialized: view
      +meta: {classification: internal}
    intermediate:
      +schema: silver
      +materialized: table
    marts:
      +schema: gold
      +materialized: table
      +meta: {classification: public}

seeds:
  device_fleet_reliability:
    +schema: ref
