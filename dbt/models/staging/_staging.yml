version: 2

models:
  - name: stg_backblaze__drive_days
    description: One row per drive per day, typed. Grain (serial_number, drive_date).
    data_tests:
      - unique_combination:
          arguments:
            columns: [serial_number, drive_date]
          config:
            severity: warn
    columns:
      - name: model
        data_tests: [not_null]
      - name: power_on_hours
        description: SMART 9 raw. Used as drive age because the data has no install date.
